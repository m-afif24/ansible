
- name: Configure Cisco Local Admin
  hosts: cisco_switch
  gather_facts: false

  tasks:
    - name: Configure admin username
      cisco.ios.ios_config:
        lines:
          - username admin privilege 15 secret 123456

    - name: Verify admin configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | include username admin
      register: result

    - name: Display admin configuration
      ansible.builtin.debug:
        var: result.stdout_lines
