
- name: Configure SNMP Cisco Switch
  hosts: cisco_switch
  gather_facts: false

  tasks:
    - name: Configure SNMP
      cisco.ios.ios_config:
        lines:
          - snmp-server community MONITORING RO
          - snmp-server location DC-ROOM
          - snmp-server contact Network-Administrator

    - name: Verify SNMP configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | include snmp-server
      register: snmp_result

    - name: Display SNMP configuration
      ansible.builtin.debug:
        var: snmp_result.stdout_lines
